<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学習支援プラットフォーム - ダッシュボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 to-teal-800 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tight">AI学習支援プラットフォーム</h1>
            <p class="text-xs text-teal-200">AIを当たり前に使う時代の自律的学習支援アプリ</p>
        </div>
        <div class="flex items-center space-x-2">
            <span class="bg-teal-700 text-teal-100 text-xs px-2.5 py-1 rounded-full font-medium">MVPデモ版</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row">
        
        <!-- Sidebar: Notebook selection -->
        <aside class="w-full md:w-80 bg-white border-r border-slate-200 p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">マイノートブック</h2>
                <button onclick="openNewNotebookModal()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-2.5 py-1.5 rounded transition">
                    + 新規作成
                </button>
            </div>
            
            <!-- Notebook list -->
            <div id="notebooks-list" class="space-y-2 flex-1 overflow-y-auto max-h-[300px] md:max-h-none">
                <div class="text-sm text-slate-400 py-4 text-center">読み込み中...</div>
            </div>
        </aside>

        <!-- Main Panel -->
        <main class="flex-1 p-6 md:p-8 flex flex-col">
            <!-- Active Notebook Title -->
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm mb-6">
                <div class="flex flex-col md:flex-row md:justify-between md:items-start">
                    <div>
                        <h2 id="active-notebook-name" class="text-2xl font-bold text-slate-800">ノートブックを選択するか、新規作成してください</h2>
                        <p id="active-notebook-desc" class="text-sm text-slate-500 mt-1">サイドバーからノートブックを選択し、ソース資料を追加してAI学習を開始します。</p>
                    </div>
                    <div id="notebook-actions" class="mt-4 md:mt-0 space-x-2 hidden">
                        <!-- Actions dynamically visible when notebook selected -->
                    </div>
                </div>
            </div>

            <!-- Content Area Dashboard (Only visible when active notebook exists) -->
            <div id="notebook-workspace" class="hidden flex-1 flex flex-col space-y-6">
                
                <!-- Tab Headers -->
                <div class="flex border-b border-slate-200 bg-white rounded-lg p-1.5 shadow-sm">
                    <button onclick="switchTab('sources')" id="tab-btn-sources" class="flex-1 py-2.5 text-center text-sm font-medium rounded-md transition bg-blue-50 text-blue-700">
                        📁 ソース資料 (Sources)
                    </button>
                    <button onclick="switchTab('notes')" id="tab-btn-notes" class="flex-1 py-2.5 text-center text-sm font-medium rounded-md transition text-slate-600 hover:text-slate-900">
                        ✍️ 自己記述 ＆ AI反論 (Notes)
                    </button>
                    <button onclick="switchTab('ai-gen')" id="tab-btn-ai-gen" class="flex-1 py-2.5 text-center text-sm font-medium rounded-md transition text-slate-600 hover:text-slate-900">
                        ✨ AI学習生成ツール
                    </button>
                </div>

                <!-- Tab 1: Sources -->
                <div id="tab-content-sources" class="space-y-6">
                    <!-- Add Source -->
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">+ ソース資料の追加</h3>
                        <form id="add-source-form" onsubmit="handleAddSource(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">資料のタイトル</label>
                                <input type="text" id="source-title" required placeholder="例：第1章 - 自律的学習の基本概念" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">ソースの種類</label>
                                    <select id="source-type" onchange="toggleSourceInputs()" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <option value="text">テキスト (Plain Text)</option>
                                        <option value="link">Webリンク (Link)</option>
                                    </select>
                                </div>
                                <div id="source-url-container" class="hidden">
                                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">URLリンク</label>
                                    <input type="url" id="source-url" placeholder="https://example.com" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">資料の本文 (AIのコンテキストに使用)</label>
                                <textarea id="source-content" required rows="5" placeholder="教科書の内容、Web記事、または研究資料などをここに貼り付けてください..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2 rounded-lg text-sm transition">
                                ソース資料を保存
                            </button>
                        </form>
                    </div>

                    <!-- List Sources -->
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">登録済みのソース資料一覧</h3>
                        <div id="sources-list" class="space-y-3">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Notes & Lock/Unlock AI Flow -->
                <div id="tab-content-notes" class="hidden space-y-6">
                    
                    <!-- Create Note Form -->
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">+ 新規ノート作成</h3>
                        <form id="create-note-form" onsubmit="handleCreateNote(event)" class="flex space-x-3">
                            <input type="text" id="note-title" required placeholder="自己記述のテーマや問いを入力してください..." class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
                                ノートを作成
                            </button>
                        </form>
                    </div>

                    <!-- Notes lists -->
                    <div id="notes-list" class="space-y-4">
                        <!-- Note blocks dynamic -->
                    </div>
                </div>

                <!-- Tab 3: AI study material generator -->
                <div id="tab-content-ai-gen" class="hidden space-y-6">
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-2">AIによる学習教材の自動生成</h3>
                        <p class="text-sm text-slate-500 mb-6">AIがノートブック内のすべてのソース資料を分析し、問題集、フラッシュカード、またはマインドマップを自動生成します。</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <!-- Card type selector -->
                            <button onclick="selectGenType('quiz')" id="gen-card-quiz" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">❓</span>
                                <span class="font-bold text-slate-800 block text-sm">テスト問題集 (Quiz)</span>
                                <span class="text-xs text-slate-400 mt-1">解説付きの4択問題（5問）を生成します。</span>
                            </button>
                            <button onclick="selectGenType('flashcards')" id="gen-card-flashcards" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">🎴</span>
                                <span class="font-bold text-slate-800 block text-sm">単語カード (Flashcards)</span>
                                <span class="text-xs text-slate-400 mt-1">重要概念を整理するためのQ&Aカードを生成します。</span>
                            </button>
                            <button onclick="selectGenType('mind_map')" id="gen-card-mind_map" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">🌿</span>
                                <span class="font-bold text-slate-800 block text-sm">マインドマップ (Mind Map)</span>
                                <span class="text-xs text-slate-400 mt-1">知識のつながりを階層ツリー構造で視覚化します。</span>
                            </button>
                            <button onclick="selectGenType('report')" id="gen-card-report" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">📝</span>
                                <span class="font-bold text-slate-800 block text-sm">要約レポート (Report)</span>
                                <span class="text-xs text-slate-400 mt-1">資料を整理・学術的にまとめた要約文を生成します。</span>
                            </button>
                            <button onclick="selectGenType('audio_overview')" id="gen-card-audio_overview" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">🎙️</span>
                                <span class="font-bold text-slate-800 block text-sm">ポッドキャスト台本 (Audio)</span>
                                <span class="text-xs text-slate-400 mt-1">2人の対話形式で資料を解説する台本を生成します。</span>
                            </button>
                            <button onclick="selectGenType('presentation')" id="gen-card-presentation" class="border border-slate-200 hover:border-blue-400 rounded-xl p-4 text-left transition bg-white shadow-sm flex flex-col justify-between">
                                <span class="text-2xl mb-2">📊</span>
                                <span class="font-bold text-slate-800 block text-sm">スライド構成案 (Presentation)</span>
                                <span class="text-xs text-slate-400 mt-1">発表用のスライド構成（目次と詳細）を生成します。</span>
                            </button>
                        </div>

                        <div class="flex items-center justify-between border-t border-slate-100 pt-4">
                            <span class="text-sm font-medium text-slate-600">選択中の生成タイプ: <strong id="selected-type-label" class="text-blue-600">テスト問題集 (Quiz)</strong></span>
                            <button onclick="triggerAIGeneration()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm shadow transition">
                                AI生成を実行
                            </button>
                        </div>
                    </div>

                    <!-- AI Outputs -->
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">AI生成結果の表示</h3>
                        <div id="ai-generations-container" class="space-y-6">
                            <!-- Dynamic generations list -->
                        </div>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <!-- Create Notebook Modal (simple prompts) -->
    <div id="new-notebook-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-800">新規ノートブックの作成</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">ノートブック名</label>
                    <input type="text" id="new-notebook-name" placeholder="例：歴史の学習ノート" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">学習の目標・説明</label>
                    <textarea id="new-notebook-desc" rows="3" placeholder="学習のテーマやメモ..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeNewNotebookModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition">キャンセル</button>
                <button onclick="handleCreateNotebook()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition">作成する</button>
            </div>
        </div>
    </div>

    <!-- Logic Script Javascript -->
    <script>
        const API_URL = '/api';
        let notebooks = [];
        let activeNotebookId = null;
        let activeTab = 'sources';
        let selectedGenType = 'quiz';

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            loadNotebooks();
        });

        // Tab Switching
        function switchTab(tab) {
            activeTab = tab;
            
            // Toggle classes on buttons
            document.getElementById('tab-btn-sources').className = `flex-1 py-2.5 text-center text-sm font-medium rounded-md transition ${tab === 'sources' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`;
            document.getElementById('tab-btn-notes').className = `flex-1 py-2.5 text-center text-sm font-medium rounded-md transition ${tab === 'notes' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`;
            document.getElementById('tab-btn-ai-gen').className = `flex-1 py-2.5 text-center text-sm font-medium rounded-md transition ${tab === 'ai-gen' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`;

            // Show/Hide sections
            document.getElementById('tab-content-sources').classList.toggle('hidden', tab !== 'sources');
            document.getElementById('tab-content-notes').classList.toggle('hidden', tab !== 'notes');
            document.getElementById('tab-content-ai-gen').classList.toggle('hidden', tab !== 'ai-gen');
        }

        // Toggle Source fields
        function toggleSourceInputs() {
            const type = document.getElementById('source-type').value;
            document.getElementById('source-url-container').classList.toggle('hidden', type !== 'link');
        }

        // AI generator select type
        function selectGenType(type) {
            selectedGenType = type;
            const labels = {
                'quiz': 'テスト問題集 (Quiz)',
                'flashcards': '単語カード (Flashcards)',
                'mind_map': 'マインドマップ (Mind Map)',
                'report': '要約レポート (Report)',
                'audio_overview': 'ポッドキャスト台本 (Audio)',
                'presentation': 'スライド構成案 (Presentation)'
            };
            document.getElementById('selected-type-label').innerText = labels[type];
            
            // Visual highlight active selection
            ['quiz', 'flashcards', 'mind_map', 'report', 'audio_overview', 'presentation'].forEach(t => {
                const card = document.getElementById(`gen-card-${t}`);
                if (card) {
                    if (t === type) {
                        card.classList.add('border-blue-500', 'ring-2', 'ring-blue-100');
                        card.classList.remove('border-slate-200');
                    } else {
                        card.classList.remove('border-blue-500', 'ring-2', 'ring-blue-100');
                        card.classList.add('border-slate-200');
                    }
                }
            });
        }

        // API Requests: Notebooks list
        async function loadNotebooks() {
            try {
                const res = await fetch(`${API_URL}/notebooks/`);
                notebooks = await res.json();
                renderNotebooksList();
            } catch (err) {
                console.error("ノートブック読み込みエラー:", err);
            }
        }

        function renderNotebooksList() {
            const container = document.getElementById('notebooks-list');
            if (notebooks.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 py-6 text-center">ノートブックがありません。「+ 新規作成」をクリックしてください。</div>`;
                return;
            }
            container.innerHTML = notebooks.map(nb => `
                <button onclick="selectNotebook(${nb.id})" class="w-full text-left px-4 py-3 rounded-xl transition text-sm flex flex-col space-y-1 ${nb.id === activeNotebookId ? 'bg-blue-600 text-white font-medium shadow-md shadow-blue-100' : 'hover:bg-slate-100 text-slate-700' }">
                    <span class="truncate block font-semibold">${nb.name}</span>
                    <span class="truncate text-xs ${nb.id === activeNotebookId ? 'text-blue-100' : 'text-slate-400'}">${nb.description || '説明なし'}</span>
                </button>
            `).join('');
        }

        async function selectNotebook(id) {
            activeNotebookId = id;
            renderNotebooksList();
            
            // Load notebook details
            try {
                const res = await fetch(`${API_URL}/notebooks/${id}/`);
                const notebook = await res.json();
                
                document.getElementById('active-notebook-name').innerText = notebook.name;
                document.getElementById('active-notebook-desc').innerText = notebook.description || '学習目標の説明はありません。';
                
                document.getElementById('notebook-workspace').classList.remove('hidden');
                document.getElementById('notebook-actions').classList.remove('hidden');
                
                // Load details of sources and notes
                renderSources(notebook.sources || []);
                renderNotes(notebook.notes || []);
                renderAIGenerations(notebook.generations || []);
                
                // Select default generator card
                selectGenType('quiz');
            } catch (err) {
                console.error("ノートブック詳細の読み込みエラー:", err);
            }
        }

        // Modal Controls
        function openNewNotebookModal() {
            document.getElementById('new-notebook-modal').classList.remove('hidden');
            document.getElementById('new-notebook-modal').classList.add('flex');
        }

        function closeNewNotebookModal() {
            document.getElementById('new-notebook-modal').classList.add('hidden');
            document.getElementById('new-notebook-modal').classList.remove('flex');
            document.getElementById('new-notebook-name').value = '';
            document.getElementById('new-notebook-desc').value = '';
        }

        async function handleCreateNotebook() {
            const name = document.getElementById('new-notebook-name').value.trim();
            const desc = document.getElementById('new-notebook-desc').value.trim();
            if (!name) return alert("ノートブック名を入力してください。");
            
            try {
                const res = await fetch(`${API_URL}/notebooks/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description: desc })
                });
                const newNb = await res.json();
                closeNewNotebookModal();
                await loadNotebooks();
                selectNotebook(newNb.id);
            } catch (err) {
                console.error("ノートブック作成エラー:", err);
            }
        }

        // Add Sources
        async function handleAddSource(e) {
            e.preventDefault();
            const title = document.getElementById('source-title').value.trim();
            const type = document.getElementById('source-type').value;
            const content = document.getElementById('source-content').value.trim();
            const url = document.getElementById('source-url').value.trim();
            
            try {
                const res = await fetch(`${API_URL}/notebooks/${activeNotebookId}/sources/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, source_type: type, content, url: type === 'link' ? url : null })
                });
                
                if (res.ok) {
                    // Reset form
                    document.getElementById('source-title').value = '';
                    document.getElementById('source-content').value = '';
                    document.getElementById('source-url').value = '';
                    // Reload
                    selectNotebook(activeNotebookId);
                } else {
                    const data = await res.json();
                    alert("エラー: " + JSON.stringify(data));
                }
            } catch (err) {
                console.error("ソース資料登録エラー:", err);
            }
        }

        function renderSources(sources) {
            const container = document.getElementById('sources-list');
            if (sources.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">登録済みのソース資料はありません。</div>`;
                return;
            }
            container.innerHTML = sources.map(src => `
                <div class="border border-slate-100 bg-slate-50/50 rounded-xl p-4 flex flex-col justify-between space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-slate-800 text-sm">${src.title}</span>
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${src.source_type === 'link' ? 'bg-indigo-50 text-indigo-700' : 'bg-teal-50 text-teal-700'}">${src.source_type === 'link' ? 'Webリンク' : 'テキスト'}</span>
                    </div>
                    ${src.url ? `<a href="${src.url}" target="_blank" class="text-xs text-blue-500 truncate block">${src.url}</a>` : ''}
                    <p class="text-xs text-slate-500 line-clamp-3 bg-white p-2.5 rounded border border-slate-100">${src.content}</p>
                </div>
            `).join('');
        }

        // Add Notes
        async function handleCreateNote(e) {
            e.preventDefault();
            const title = document.getElementById('note-title').value.trim();
            if (!title) return;
            
            try {
                const res = await fetch(`${API_URL}/notebooks/${activeNotebookId}/notes/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, initial_content: '' })
                });
                
                if (res.ok) {
                    document.getElementById('note-title').value = '';
                    selectNotebook(activeNotebookId);
                } else {
                    const data = await res.json();
                    alert("エラー: " + JSON.stringify(data));
                }
            } catch (err) {
                console.error("ノート作成エラー:", err);
            }
        }

        function renderNotes(notes) {
            const container = document.getElementById('notes-list');
            if (notes.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">ノートはまだありません。自己記述を行うためのノートを新規作成してください。</div>`;
                return;
            }
            
            container.innerHTML = notes.map(note => {
                if (note.is_locked) {
                    // Locked View
                    return `
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h4 class="font-bold text-slate-800 text-base">テーマ: ${note.title}</h4>
                                <span class="bg-rose-50 text-rose-700 text-xs font-bold px-2.5 py-1 rounded-full flex items-center">🔒 AIの反論（ロック中）</span>
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-slate-500 uppercase">自分の考えを入力してください（AI反論をアンロックするには20文字以上入力が必要）</label>
                                <textarea id="initial-input-${note.id}" rows="4" placeholder="このテーマについて、今あなたが考えていることを記述してください。まず自分の頭で考え、記述したあとにAIの対話・反論機能が利用可能になります..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <div class="flex justify-end">
                                <button onclick="unlockNote(${note.id})" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
                                    考えを送信してAI反論をアンロック
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    // Unlocked View
                    return `
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h4 class="font-bold text-slate-800 text-base">テーマ: ${note.title}</h4>
                                <span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full">🔓 AIアンロック済み</span>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Student Thought -->
                                <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                    <h5 class="text-xs font-bold text-slate-500 uppercase mb-2">あなたの初期の意見</h5>
                                    <p class="text-sm text-slate-800 whitespace-pre-wrap">${note.initial_content}</p>
                                </div>
                                <!-- AI Rebuttal -->
                                <div class="bg-teal-50/50 rounded-xl p-4 border border-teal-100">
                                    <h5 class="text-xs font-bold text-teal-600 uppercase mb-2">AIによる論理的反論</h5>
                                    <p class="text-sm text-slate-800 whitespace-pre-wrap font-medium">${note.ai_rebuttal}</p>
                                </div>
                            </div>
                            
                            <!-- Student Revision -->
                            <div class="border-t border-slate-100 pt-4 space-y-3">
                                <h5 class="text-sm font-semibold text-slate-700">✍️ 自分の考えをブラッシュアップする</h5>
                                <p class="text-xs text-slate-400">上のAIの論理的反論をよく読み、自分の考えを再検討し、さらに深めたり反論に対する意見を下に記述してください。</p>
                                <textarea id="revise-input-${note.id}" rows="3" placeholder="AIの意見を受けて、私は...と考えます。または、次の理由により当初の主張を維持します..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${note.revised_content || ''}</textarea>
                                <div class="flex justify-end">
                                    <button onclick="saveRevision(${note.id})" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
                                        修正した考えを保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Unlock and submit initial content to unlock AI rebuttal
        async function unlockNote(noteId) {
            const content = document.getElementById(`initial-input-${noteId}`).value.trim();
            if (content.length < 20) {
                return alert("自己記述を引き出すため、20文字以上入力してください。");
            }
            
            try {
                const res = await fetch(`${API_URL}/notes/${noteId}/unlock/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initial_content: content })
                });
                
                if (res.ok) {
                    selectNotebook(activeNotebookId);
                } else {
                    const data = await res.json();
                    alert("エラー: " + (data.error || JSON.stringify(data)));
                }
            } catch (err) {
                console.error("アンロック処理エラー:", err);
            }
        }

        // Submit revised content
        async function saveRevision(noteId) {
            const content = document.getElementById(`revise-input-${noteId}`).value.trim();
            if (!content) return alert("内容を入力してください。");
            
            try {
                const res = await fetch(`${API_URL}/notes/${noteId}/revise/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ revised_content: content })
                });
                
                if (res.ok) {
                    alert("修正した考えを保存しました！");
                    selectNotebook(activeNotebookId);
                } else {
                    const data = await res.json();
                    alert("エラー: " + JSON.stringify(data));
                }
            } catch (err) {
                console.error("修正保存エラー:", err);
            }
        }

        // Trigger AI Generation based on all sources
        async function triggerAIGeneration() {
            try {
                const res = await fetch(`${API_URL}/notebooks/${activeNotebookId}/generate/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ generation_type: selectedGenType })
                });
                
                if (res.ok) {
                    selectNotebook(activeNotebookId);
                } else {
                    const data = await res.json();
                    alert("エラー: " + (data.error || JSON.stringify(data)));
                }
            } catch (err) {
                console.error("AI生成処理エラー:", err);
            }
        }

        function renderAIGenerations(generations) {
            const container = document.getElementById('ai-generations-container');
            if (generations.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">AIによって生成された教材はありません。</div>`;
                return;
            }
            
            container.innerHTML = generations.map(gen => {
                const titles = {
                    'quiz': '❓ テスト問題集 (Quiz)',
                    'flashcards': '🎴 単語カード (Flashcards)',
                    'mind_map': '🌿 マインドマップ (Mind Map)',
                    'report': '📝 要約レポート (Report)',
                    'audio_overview': '🎙️ ポッドキャスト台本 (Audio)',
                    'presentation': '📊 スライド構成案 (Presentation)'
                };
                
                let renderedContent = '';
                if (gen.generation_type === 'quiz' || gen.generation_type === 'flashcards') {
                    try {
                        const items = JSON.parse(gen.content);
                        if (gen.generation_type === 'quiz') {
                            renderedContent = items.map((q, idx) => `
                                <div class="bg-slate-50 border border-slate-100 rounded-lg p-4 space-y-2">
                                    <div class="font-bold text-slate-800 text-sm">問 ${idx + 1}: ${q.question}</div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                                        ${q.options.map(opt => `<div class="bg-white border border-slate-200 px-3 py-2 rounded text-xs text-slate-600">${opt}</div>`).join('')}
                                    </div>
                                    <div class="text-xs text-teal-700 font-semibold mt-2">正解: ${q.answer}</div>
                                    <div class="text-xs text-slate-400 italic">解説: ${q.explanation}</div>
                                </div>
                            `).join('');
                        } else {
                            renderedContent = items.map((f, idx) => `
                                <div class="bg-slate-50 border border-slate-100 rounded-lg p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="border-b md:border-b-0 md:border-r border-slate-200 pb-3 md:pb-0 md:pr-4">
                                        <div class="text-xs font-bold text-slate-400 uppercase">カード表面 (問題/用語)</div>
                                        <div class="text-sm font-semibold text-slate-800 mt-1">${f.question}</div>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-teal-500 uppercase">カード裏面 (解答/説明)</div>
                                        <div class="text-sm text-slate-700 mt-1 font-medium">${f.answer}</div>
                                    </div>
                                </div>
                            `).join('');
                        }
                    } catch (e) {
                        renderedContent = `<pre class="text-xs bg-slate-900 text-teal-400 p-4 rounded overflow-auto whitespace-pre-wrap">${gen.content}</pre>`;
                    }
                } else {
                    renderedContent = `<div class="whitespace-pre-wrap text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100 font-mono leading-relaxed">${gen.content}</div>`;
                }

                return `
                    <div class="border border-slate-200 rounded-xl p-5 shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <h4 class="font-bold text-slate-800 text-sm">${titles[gen.generation_type] || gen.generation_type}</h4>
                            <span class="text-[10px] text-slate-400 font-semibold">${new Date(gen.created_at).toLocaleString('ja-JP')}</span>
                        </div>
                        <div class="space-y-3">
                            ${renderedContent}
                        </div>
                    </div>
                `;
            }).reverse().join('');
        }
    </script>
</body>
</html>
