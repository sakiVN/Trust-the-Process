{% load static %}
<!-- 3. VIEW: DOCUMENTS (UNIFIED LIST VIEW) -->
<section id="view-documents" class="hidden space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center space-x-3.5">
      <img src="{% static 'notebook/icon-set/upload.png' %}" class="w-11 h-11 -my-1 object-contain shrink-0 drop-shadow-md" alt="Tài liệu" />
      <div>
        <h2 translate="key_54" class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Tất cả tài liệu của bạn</h2>
        <p translate="key_55" class="text-xs text-slate-400 mt-0.5">Danh sách tổng hợp tài nguyên học tập nguồn từ tất cả các sổ tay của bạn.</p>
      </div>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <!-- Sort Dropdown -->
      <div class="flex items-center gap-2">
        <label for="documents-sort-select" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap" translate="key_sort_label">Sắp xếp:</label>
        <select id="documents-sort-select" onchange="setDocumentsSort(this.value)" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 transition cursor-pointer">
          <option value="date_desc" translate="key_sort_date_desc">Mới nhất</option>
          <option value="date_asc" translate="key_sort_date_asc">Cũ nhất</option>
          <option value="name_asc" translate="key_sort_name_asc">Tên: A → Z</option>
          <option value="name_desc" translate="key_sort_name_desc">Tên: Z → A</option>
        </select>
      </div>
      <button onclick="openQuickUploadModal()" class="inline-flex items-center space-x-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl text-xs shadow-md shadow-brand-100 dark:shadow-none transition transform hover:-translate-y-0.5 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        <span translate="key_quick_upload_title">Tải lên tài liệu mới</span>
      </button>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
    <div id="all-documents-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Loaded dynamically -->
    </div>
    <!-- Pagination -->
    <div id="documents-pagination" class="mt-6">
      <!-- Rendered dynamically by renderAllDocumentsView -->
    </div>
  </div>
</section>
