{% load static %}
<!-- 3. VIEW: DOCUMENTS (UNIFIED LIST VIEW) -->
<section id="view-documents" class="hidden space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center space-x-3.5">
      <img src="{% static 'notebook/icon-set/upload.png' %}" class="w-10 h-10 object-contain shrink-0" alt="Tài liệu" />
      <div>
        <h2 translate="key_54" class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Tất cả tài liệu của bạn</h2>
        <p translate="key_55" class="text-xs text-slate-400 mt-0.5">Danh sách tổng hợp tài nguyên học tập nguồn từ tất cả các sổ tay của bạn.</p>
      </div>
    </div>
    <button onclick="openQuickUploadModal()" class="inline-flex items-center space-x-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl text-xs shadow-md shadow-brand-100 dark:shadow-none transition transform hover:-translate-y-0.5 shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
      <span translate="key_quick_upload_title">Tải lên tài liệu mới</span>
    </button>
  </div>


  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
    <div id="all-documents-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Loaded dynamically -->
    </div>
  </div>
</section>
