    {% load static %}
    <!-- Contextual AI Toolbar -->
    <div id="contextual-ai-toolbar" class="hidden absolute z-[90] bg-slate-900 shadow-xl rounded-lg border border-slate-700 p-2 flex items-center space-x-2 transition-all duration-200" style="top: 0; left: 0;">
        <button onclick="triggerContextAction('explain')" class="flex items-center space-x-2 px-3 py-2 hover:bg-slate-800 rounded-md text-slate-200 text-xs font-semibold transition group">
            <img src="{% static 'notebook/icons/greeting.png' %}" class="w-5 h-5 object-contain" alt="Explain">
            <span class="group-hover:text-white">Giải thích</span>
        </button>
        <div class="w-px h-5 bg-slate-700"></div>
        <button onclick="triggerContextAction('translate')" class="flex items-center space-x-2 px-3 py-2 hover:bg-slate-800 rounded-md text-slate-200 text-xs font-semibold transition group">
            <img src="{% static 'notebook/icons/material.png' %}" class="w-5 h-5 object-contain" alt="Translate">
            <span class="group-hover:text-white">Dịch</span>
        </button>
        <div class="w-px h-5 bg-slate-700"></div>
        <button onclick="triggerContextAction('flashcard')" class="flex items-center space-x-2 px-3 py-2 hover:bg-brand-600 bg-brand-500/20 rounded-md text-brand-300 text-xs font-bold transition group">
            <img src="{% static 'notebook/icons/flashcard.png' %}" class="w-5 h-5 object-contain" alt="Flashcard">
            <span class="group-hover:text-white">Lưu Flashcard</span>
        </button>
    </div>

    <!-- Contextual AI Result Modal -->
    <div id="contextual-result-modal" class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800 animate-[fadeIn_0.2s_ease-out]">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                    <span id="contextual-result-icon">✨</span>
                    <span id="contextual-result-title">Kết quả AI</span>
                </h3>
                <button onclick="closeContextualModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition bg-slate-200/50 dark:bg-slate-800 p-1.5 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <div id="contextual-result-content" class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">
                    <!-- Loading or content here -->
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'notebook/js/context.js' %}"></script>

    <!-- Document Read Modal -->
    <div id="document-read-modal" class="hidden fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm items-center justify-center p-4 sm:p-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-3xl w-full h-full max-h-[85vh] shadow-2xl flex flex-col border border-slate-200 dark:border-slate-800 animate-[fadeIn_0.2s_ease-out]">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-900/80 rounded-t-2xl shrink-0">
                <div class="min-w-0 pr-4">
                    <h3 id="document-read-title" class="font-bold text-slate-800 dark:text-slate-100 text-lg truncate">Tiêu đề tài liệu</h3>
                    <p id="document-read-notebook" class="text-xs text-brand-500 font-semibold mt-0.5 truncate">Sổ tay</p>
                </div>
                <button onclick="closeDocumentModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-xl shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 sm:p-8 overflow-y-auto flex-1 custom-scrollbar bg-white dark:bg-slate-950">
                <div id="document-read-content" class="w-full">
                    <!-- Content injected here -->
                </div>
            </div>
        </div>
    </div>
