{% load static %}
<!-- 7. VIEW: SETTINGS -->
<section id="view-settings" class="hidden space-y-6">
  <div class="flex items-center space-x-3.5">
    <img src="{% static 'notebook/icon-set/option.png' %}" class="w-10 h-10 object-contain shrink-0" alt="Cài đặt" />
    <div>
      <h2 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Cài đặt hệ thống</h2>
      <p class="text-xs text-slate-400 mt-0.5">Quản lý hồ sơ cá nhân và cấu hình ứng dụng.</p>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm max-w-2xl">
    <form onsubmit="saveSettings(event)" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tên hiển thị</label>
          <input id="input-display-name" type="text" value="{{ user.first_name|default:user.username }}" placeholder="nhập tên người dùng" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
          <input type="email" value="{{ user.email }}" placeholder="nhập địa chỉ email" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Quyền hạn tài khoản</label>
          <select id="select-user-role" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-brand-500">
            <option value="Học sinh">Student (Học sinh) - Free Account</option>
            <option value="Giáo viên">Teacher (Giáo viên) - Pro Account</option>
            <option value="Quản trị viên">Admin (Quản trị viên) - Premium</option>
          </select>
        </div>
        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">Lưu thay đổi</button>
        </div>
      </div>
    </form>
  </div>
  
  <div>
    <h2 class="mt-6 text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Cài đặt ngôn ngữ</h2>
  </div>
  <div class="mt-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm max-w-2xl">
    <form>
      <div class="mt-6">
        <label class="block mb-2 text-xs font-bold tracking-wider text-gray-500 uppercase">NGÔN NGỮ / LANGUAGE / 言語</label>
        <div class="relative">
          <select id="language-select" onchange="loadLanguage(this.value)" class="w-full px-4 py-3 text-sm text-slate-700 dark:text-slate-200 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500 appearance-none">
            <option value="vi" selected>VI /Tiếng Việt /ベトナム語</option>
            <option value="jp">JP /Tiếng Nhật /日本語</option>
            <option value="en">EN /Tiếng Anh /英語</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">Lưu thay đổi</button>
        </div>
      </div>
    </form>
  </div>
</section>
